purpose:
  stands_in_for: Telegram Bot API getMe, getWebhookInfo, getUpdates and sendMessage, with synthetic token and chats only.
  unblocks: Testing read-only account commands, private-chat routing, polling offsets and HTTP error handling without contacting Telegram.
assumptions:
  - id: html-trade-notices
    status: supported
    claim: Automatic buy and sell notices carry HTML formatting through NotificationServiceV2 and the native HTTP client in the tested local scenario.
    reason: Real signal and fill producers emitted HTML-mode notifications in unit tests. The existing repository stand-in recorded buy and sell sendMessage requests with bold Spanish titles and parse_mode HTML.
    verification: On 2026-11-27, 50 unit tests and eight local HTTP simulation tests passed, including a buy and sell delivery. Simulation request logs showed two successful automatic sendMessage calls, in addition to the command reply. PostgreSQL, Kafka and real Telegram rendering were not exercised.
    source: src/v2/notifications/telegram-trades.ts; src/v2/persistence/store.service.ts; src/v2/trading/trading.services.ts; test/v2/telegram-trades.spec.ts; test/v2/telegram-http.integration-spec.ts
    updated_at: '2026-11-27'
  - id: html-command-delivery
    status: supported
    claim: New command replies carry parse_mode HTML through the outbox and native HTTP client in the exercised local scenario; older plain-text events remain supported.
    reason: The local Postman stand-in recorded sendMessage with parse_mode HTML and bold markup, and unit tests verified escaping, balanced message chunks and plain-text notification delivery. The official Bot API documents HTML formatting and escaping.
    verification: On 2026-11-27, 40 tests passed across telegram-commands, telegram-notifications and telegram-http.integration-spec. The simulation log included getMe, getWebhookInfo, getUpdates and sendMessage (200). The stand-in records formatting metadata but does not render it or validate Telegram HTML. No real Telegram message was sent; visual rendering in the app remains unverified.
    source: https://core.telegram.org/bots/api#html-style; test/v2/telegram-http.integration-spec.ts; test/v2/telegram-commands.spec.ts; test/v2/telegram-notifications.spec.ts; postman/mocks/telegram/default.js
    updated_at: '2026-11-27'
  - id: local-command-pipeline
    status: supported
    claim: In the exercised local scenario, the receiver creates one account-scoped reply, the sender sends it to chat 111 and the next poll acknowledges the committed update.
    reason: The real client, receiver and notification service ran against the HTTP stand-in; persistence and outbox delivery were explicit in-memory doubles.
    verification: Seven HTTP simulation tests passed on 2026-11-26. The simulation logged getMe, getWebhookInfo, getUpdates and sendMessage; response text contained only the selected account's position and the next offset was 41. Real PostgreSQL and Kafka were not exercised by this run.
    source: test/v2/telegram-http.integration-spec.ts; test/v2/telegram-command.fixtures.ts; src/v2/notifications/telegram-commands.service.ts
    updated_at: '2026-11-26'
  - id: polling-contract
    status: supported
    claim: Telegram getUpdates accepts an offset that confirms previous updates and cannot be used while a webhook is configured.
    reason: These behaviors are specified in the official Bot API contract and are modeled by the stand-in.
    verification: Read official documentation on 2026-11-26; local HTTP tests demonstrated offset acknowledgement and refusal to poll a bot with a configured webhook. No production bot queue was read or modified.
    source: https://core.telegram.org/bots/api#getupdates; https://core.telegram.org/bots/api#getwebhookinfo
    updated_at: '2026-11-26'
  - id: bounded-failure-handling
    status: supported
    claim: In the tested HTTP scenarios, 401, 409, 429, HTML gateway errors and a delayed response produce sanitized caller failures; a second request during retry_after is not sent.
    reason: Native fetch exercised serialization, JSON error parsing, timeout and cooldown handling through the local Postman server.
    verification: Seven local integration cases passed. Request logs contained one getUpdates call for the rate-limit case; exceptions did not include the synthetic credential. This does not establish real provider availability or request timing.
    source: src/v2/notifications/telegram.client.ts; postman/mocks/telegram/default.js; test/v2/telegram-http.integration-spec.ts
    updated_at: '2026-11-26'
  - id: production-delivery
    status: unknown
    claim: The deployed bot can poll updates and deliver command replies using the production account mapping and worker environment.
    reason: No deployed receiver was started and no real Telegram command or message was sent during this implementation. The existing bot may have another reader or a webhook.
    verification: Pending deployment, confirmation of telegram_commands_started and an actual private /abiertas command. Existing sender-only Telegram verification predates this command receiver and does not establish it works remotely.
    source: docs/v6-dynamic-take-profit.md; src/v2/notifications/telegram-commands.service.ts
    updated_at: '2026-11-26'
