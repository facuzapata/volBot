name: volbot-v2
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: volbot_v2
      POSTGRES_USER: volbot_v2
      POSTGRES_PASSWORD: ${V2_POSTGRES_PASSWORD:?Set V2_POSTGRES_PASSWORD in .env.v2}
    ports: ["127.0.0.1:${V2_POSTGRES_PORT:-15432}:5432"]
    volumes: ["v2_pgdata:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U volbot_v2 -d volbot_v2"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${V2_REDIS_PORT:-16379}:6379"]
    volumes: ["v2_redisdata:/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
  kafka-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /tmp/kraft-combined-logs"]
    volumes: ["v2_kafkadata:/tmp/kraft-combined-logs"]
    restart: "no"
  kafka:
    image: apache/kafka:3.9.1
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${V2_KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports: ["127.0.0.1:${V2_KAFKA_PORT:-19092}:19092"]
    volumes: ["v2_kafkadata:/tmp/kraft-combined-logs"]
    depends_on: { kafka-init: { condition: service_completed_successfully } }
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
  migrate:
    build: { context: ., dockerfile: Dockerfile.v2 }
    command: ["node", "dist/v2/cli.js", "migrate"]
    env_file: [.env.v2]
    environment:
      V2_DATABASE_URL: postgresql://volbot_v2:${V2_POSTGRES_PASSWORD}@postgres:5432/volbot_v2
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"
  api:
    build: { context: ., dockerfile: Dockerfile.v2 }
    command: ["node", "dist/main.js"]
    env_file: [.env.v2]
    environment:
      TRADING_MODE: PAPER
      V2_DATABASE_URL: postgresql://volbot_v2:${V2_POSTGRES_PASSWORD}@postgres:5432/volbot_v2
      V2_REDIS_URL: redis://redis:6379
      V2_API_PORT: 3100
    ports: ["127.0.0.1:${V2_API_PORT:-3100}:3100"]
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy } }
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3100/api/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    build: { context: ., dockerfile: Dockerfile.v2 }
    command: ["node", "dist/worker.js"]
    env_file: [.env.v2]
    environment:
      TRADING_MODE: PAPER
      V2_DATABASE_URL: postgresql://volbot_v2:${V2_POSTGRES_PASSWORD}@postgres:5432/volbot_v2
      V2_REDIS_URL: redis://redis:6379
      V2_KAFKA_BROKERS: kafka:9092
      V2_WORKER_PORT: 3101
    depends_on: { migrate: { condition: service_completed_successfully }, redis: { condition: service_healthy }, kafka: { condition: service_healthy } }
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  v2_pgdata:
  v2_redisdata:
  v2_kafkadata:
