version: '3.8'

services:
  db:
    image: postgres:16
    container_name: profit_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-${DATABASE_NAME:-postgres}}
      POSTGRES_USER: ${DB_USERNAME:-${DATABASE_USERNAME:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-${DATABASE_PASSWORD:-postgres}}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: profit_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes

  ollama:
    image: ollama/ollama:latest
    container_name: volbot_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    container_name: profit_bot_app
    command: npm run start:dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-${DATABASE_USERNAME:-postgres}}
      DB_PASSWORD: ${DB_PASSWORD:-${DATABASE_PASSWORD:-postgres}}
      DB_NAME: ${DB_NAME:-${DATABASE_NAME:-postgres}}
    depends_on:
      - db
      - redis
      - ollama

volumes:
  pgdata:
  redisdata:
  ollama_data:
